<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix com Player Flutuante</title>
<style>
*,
*::before,
*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: hidden; background: #000; color: #fff; font-family: Arial, sans-serif; }

/* CABEÇALHO */
header { width: 100%; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); position: sticky; top: 0; z-index: 100; }
header h1 { color: #e50914; font-size: 32px; }
nav a { margin-left: 25px; text-decoration: none; color: #fff; font-size: 18px; }
nav a:hover { color: #e50914; }

/* BANNER */
#banner { width: 100%; height: 500px; display: flex; align-items: flex-end; padding: 40px; background-size: cover; background-position: center; margin-bottom: 20px; }
#banner h2 { font-size: 48px; text-shadow: 2px 2px 8px #000; }

/* FILEIRAS */
.row { display: flex; overflow-x: auto; padding: 20px 40px; gap: 20px; scroll-behavior: smooth; }
.row::-webkit-scrollbar { display: none; }

/* CARDS */
.card { min-width: 250px; height: 375px; background: #222; border-radius: 6px; overflow: hidden; flex-shrink: 0; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; }
.card:hover { transform: scale(1.08); box-shadow: 0 10px 20px rgba(0,0,0,0.7); }
.card img { width: 100%; height: 100%; object-fit: cover; }

/* PLAYER FLUTUANTE */
#player-modal {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80%; max-width: 1000px;
    height: 500px;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    z-index: 1000;
    box-shadow: 0 10px 50px rgba(0,0,0,0.7);
}

#player-modal iframe {
    width: 100%;
    height: 100%;
}

#player-modal .close-btn {
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    border: none;
    font-size: 20px;
    padding: 5px 10px;
    cursor: pointer;
    border-radius: 5px;
}
</style>
</head>
<body>

<header>
<h1>NETFLIX</h1>
<nav>
    <a href="#">Início</a>
    <a href="#">Filmes</a>
</nav>
</header>

<div id="banner"><h2 id="banner-title">Destaque</h2></div>

<!-- Modal flutuante do player -->
<div id="player-modal">
    <button class="close-btn" onclick="closePlayer()">X</button>
    <iframe src="" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
</div>

<!-- Catálogo de filmes -->
<div id="catalogo"></div>

<script>
// Lista de filmes
const filmes = [
    { nome: "CARROS", id: "1W9J1EvIbuei7YkiILt33d00-7mvmvkjB", img: "https://link-da-imagem1.jpg" },
    { nome: "CARROS 2", id: "1HqqJ5QlxKOmrrQi5wlWlbdkxNcc1e869", img: "https://link-da-imagem2.jpg" },
    { nome: "CARROS 3", id: "1vO0GuhCuCBjfLlt5FcXWMclPw5sp8vJG", img: "https://link-da-imagem3.jpg" },
    { nome: "INCRÍVEIS", id: "1ABCDEFghiJKLMNopQRsTuvwXYz12345", img: "https://link-da-imagem4.jpg" },
    { nome: "TOY STORY", id: "1ZYXWVUTSRQPONMLKJIHGFEDCBA98765", img: "https://link-da-imagem5.jpg" },
];

// Banner do primeiro filme
const banner = document.getElementById("banner");
const bannerTitle = document.getElementById("banner-title");
const destaque = filmes[0];
banner.style.backgroundImage = `url('${destaque.img}')`;
bannerTitle.textContent = destaque.nome;

// Player flutuante
const playerModal = document.getElementById("player-modal");
const playerIframe = playerModal.querySelector("iframe");

function playVideo(id) {
    playerIframe.src = `https://drive.google.com/file/d/${id}/preview`;
    playerModal.style.display = "block";
}

function closePlayer() {
    playerIframe.src = "";
    playerModal.style.display = "none";
}

// Criar fileiras automáticas
const catalogo = document.getElementById("catalogo");
const filmesPorFileira = 8;
let index = 0;

while (index < filmes.length) {
    const row = document.createElement("div");
    row.classList.add("row");

    for (let i = 0; i < filmesPorFileira; i++) {
        if (!filmes[index]) break;

        const f = filmes[index];
        const card = document.createElement("div");
        card.classList.add("card");
        card.innerHTML = `<img src="${f.img}" alt="${f.nome}">`;

        card.onclick = () => playVideo(f.id);

        row.appendChild(card);
        index++;
    }

    catalogo.appendChild(row);
}
</script>

</body>
</html>
