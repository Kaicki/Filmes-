<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Clone</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family: Arial, sans-serif; background:#000; color:#fff; overflow-x:hidden; }

  /* Cabeçalho */
  header { display:flex; align-items:center; padding:10px 20px; background:#111; position:fixed; width:100%; top:0; z-index:1000; }
  header .logo { font-size:24px; font-weight:bold; margin-right:50px; color:#e50914; }
  header nav a { margin-right:20px; color:#fff; text-decoration:none; font-weight:bold; cursor:pointer; transition:0.3s; }
  header nav a:hover { color:#e50914; }

  /* Banner */
  .banner { width:100%; height:60vh; display:flex; align-items:center; justify-content:center; background:#111; margin-top:60px; position:relative; overflow:hidden; }
  .banner img { position:absolute; width:100%; height:100%; object-fit:cover; opacity:0.5; }
  .banner h1 { font-size:3rem; z-index:1; color:#e50914; text-shadow: 2px 2px 10px #000; }

  /* Carrossel */
  .carousel-title { margin:20px 20px 10px; font-size:1.2rem; color:#e50914; }
  .carousel { display:flex; overflow-x:auto; padding:0 20px; gap:10px; scroll-behavior: smooth; }
  .carousel::-webkit-scrollbar { display:none; }
  .card { min-width:200px; height:300px; background:#222; flex-shrink:0; cursor:pointer; border-radius:4px; overflow:hidden; transition:0.3s; }
  .card img { width:100%; height:100%; object-fit:cover; }
  .card:hover { transform: scale(1.05); }

  /* Modal Player */
  #modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); align-items:center; justify-content:center; z-index:2000; }
  #modal iframe { width:80%; height:80%; border:none; }
  #modal .close { position:absolute; top:20px; right:30px; font-size:30px; cursor:pointer; color:#fff; }
</style>
</head>
<body>

<header>
  <div class="logo">Netflix Clone</div>
  <nav>
    <a onclick="scrollToTop()">Início</a>
    <a onclick="scrollToSection(0)">Filmes</a>
    <a onclick="scrollToSection(1)">Séries</a>
  </nav>
</header>

<div class="banner" id="banner">
  <h1>Bem-vindo!</h1>
</div>

<div id="carousels"></div>

<!-- Modal do player -->
<div id="modal">
  <span class="close" onclick="closeModal()">×</span>
  <iframe id="player" src="" allowfullscreen></iframe>
</div>

<script>
  const videos = [
    {id:"DRIVE_ID_1", img:"https://via.placeholder.com/200x300?text=Filme+1"},
    {id:"DRIVE_ID_2", img:"https://via.placeholder.com/200x300?text=Filme+2"},
    {id:"DRIVE_ID_3", img:"https://via.placeholder.com/200x300?text=Série+1"},
    {id:"DRIVE_ID_4", img:"https://via.placeholder.com/200x300?text=Série+2"},
    // Adicione mais vídeos aqui
  ];

  // Banner aleatório
  function setRandomBanner(){
    const banner = document.getElementById('banner');
    const randomVideo = videos[Math.floor(Math.random()*videos.length)];
    banner.innerHTML = `<h1>${randomVideo.img.split('=')[1]}</h1><img src="${randomVideo.img}" alt="">`;
  }

  function createCarousel(){
    const container = document.getElementById('carousels');
    container.innerHTML = "";

    const categories = ["Filmes", "Séries"];
    categories.forEach((cat,index)=>{
      const title = document.createElement('div');
      title.className='carousel-title';
      title.textContent = cat;
      container.appendChild(title);

      const carouselWrapper = document.createElement('div');
      carouselWrapper.className='carousel';

      // repete vídeos
      videos.forEach(v=>{
        const card = document.createElement('div');
        card.className='card';
        const img = document.createElement('img');
        img.src=v.img;
        card.appendChild(img);
        card.addEventListener('click',()=>openModal(v.id));
        carouselWrapper.appendChild(card);
      });

      container.appendChild(carouselWrapper);
    });
  }

  function openModal(id){
    document.getElementById('player').src = `https://drive.google.com/file/d/${id}/preview`;
    document.getElementById('modal').style.display='flex';
  }

  function closeModal(){
    document.getElementById('player').src='';
    document.getElementById('modal').style.display='none';
  }

  function scrollToTop(){ window.scrollTo({top:0, behavior:'smooth'}); }
  function scrollToSection(idx){
    const carousels = document.querySelectorAll('.carousel');
    if(carousels[idx]) carousels[idx].scrollIntoView({behavior:'smooth'});
  }

  setRandomBanner();
  createCarousel();
</script>

</body>
</html>
