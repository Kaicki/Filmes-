<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Clone</title>

<style>
body {
  margin: 0;
  background: #000;
  font-family: Arial, sans-serif;
  color: #fff;
  overflow-x: hidden;
}

/* NAVBAR */
nav {
  width: 100%;
  display: flex;
  align-items: center;
  padding: 20px;
  position: fixed;
  top: 0;
  z-index: 1000;
  background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0));
}

nav img {
  height: 35px;
}

nav ul {
  display: flex;
  gap: 20px;
  list-style: none;
  margin-left: 40px;
}

nav ul li {
  cursor: pointer;
  font-size: 15px;
  opacity: .8;
}

nav ul li:hover {
  opacity: 1;
}

/* BANNER */
#banner {
  width: 100%;
  height: 60vh;
  background-size: cover;
  background-position: center;
  margin-top: 70px;
  display: flex;
  align-items: flex-end;
  padding: 40px;
  box-sizing: border-box;
}

/* SEÇÃO */
.section {
  margin-top: 30px;
  padding: 20px;
}

.section h2 {
  margin-left: 5px;
  font-size: 22px;
}

/* CARROSSEL */
.carousel {
  display: flex;
  overflow-x: auto;
  gap: 15px;
  padding-bottom: 20px;
  scroll-behavior: smooth;
}

.carousel::-webkit-scrollbar {
  height: 7px;
}

.carousel::-webkit-scrollbar-thumb {
  background: red;
  border-radius: 10px;
}

/* CARDS */
.card {
  min-width: 170px;
  height: 250px;
  border-radius: 10px;
  overflow: hidden;
  background: #111;
  cursor: pointer;
  transition: transform .3s;
}

.card:hover {
  transform: scale(1.08);
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card h3 {
  text-align: center;
  font-size: 15px;
  padding: 8px;
}

/* PLAYER */
#playerModal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,.7);
  align-items: center;
  justify-content: center;
  z-index: 2000;
}

.player-content {
  width: 90%;
  max-width: 900px;
}

#videoPlayer {
  width: 100%;
  height: 500px;
  border: none;
  border-radius: 10px;
}

.close-player {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 40px;
  cursor: pointer;
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav>
  <img src="https://upload.wikimedia.org/wikipedia/commons/7/7a/Logonetflix.png">
  <ul>
    <li>Início</li>
    <li>Filmes</li>
    <li>Séries</li>
    <li>Minha lista</li>
  </ul>
</nav>

<!-- BANNER DINÂMICO -->
<div id="banner"></div>

<!-- SEÇÃO -->
<div class="section">
  <h2>Filmes</h2>
  <div class="carousel">

    <!-- CARD EXEMPLO — substitua o data-video pelo seu link -->
    <div class="card" data-video="https://drive.google.com/file/d/1W9J1EvIbuei7YkiILt33d00-7mvmvkjB/view?usp=sharing">
      <img src="https://image.tmdb.org/t/p/w500/2Y35XCUS8U8vC8sFzx7dwY4w6Jk.jpg">
      <h3>Filme 1</h3>
    </div>

    <div class="card" data-video="https://drive.google.com/file/d/1nphBCTqWEKSvZOJ67kZCPEWyk7SoD2yy/view?usp=sharing">
      <img src="https://image.tmdb.org/t/p/w500/pbVZ7Offy7Q4v4IsjT70q3y5I3X.jpg">
      <h3>Detona Ralph</h3>
    </div>

    <div class="card" data-video="https://drive.google.com/file/d/1ZgT4YZxxxxKYFJJJxxxxxx/view?usp=sharing">
      <img src="https://image.tmdb.org/t/p/w500/4W0FnjSGn4x0mKqZpVZJ2nSr8Fq.jpg">
      <h3>Filme 3</h3>
    </div>

  </div>
</div>

<!-- PLAYER MODAL -->
<div id="playerModal">
  <span class="close-player">&times;</span>
  <div class="player-content">
    <iframe id="videoPlayer" allow="autoplay" allowfullscreen></iframe>
  </div>
</div>

<script>
/* BANNER ALEATÓRIO */
const banners = [
  "https://image.tmdb.org/t/p/original/4W0FnjSGn4x0mKqZpVZJ2nSr8Fq.jpg",
  "https://image.tmdb.org/t/p/original/6zbKgwgaaCyyBXE4Sun4oWQfQmi.jpg",
  "https://image.tmdb.org/t/p/original/iopYFB1b6Bh7FWZh3onQhXLpT7w.jpg"
];

document.getElementById("banner").style.backgroundImage =
  `url('${banners[Math.floor(Math.random()*banners.length)]}')`;

/* CONVERTE LINK DO DRIVE PARA /preview */
function toPreview(url) {
  if (url.includes("/preview")) return url;
  let id = "";
  const regex =
    /\/file\/d\/(.*?)\/|id=(.*?)$|open\?id=(.*?)$/;
  const match = url.match(regex);
  if (match) id = match[1] || match[2] || match[3];
  return `https://drive.google.com/file/d/${id}/preview`;
}

/* PLAYER */
const modal = document.getElementById("playerModal");
const iframe = document.getElementById("videoPlayer");

document.querySelectorAll(".card").forEach(card => {
  card.addEventListener("click", () => {
    const link = card.getAttribute("data-video");
    iframe.src = toPreview(link);
    modal.style.display = "flex";
  });
});

document.querySelector(".close-player").onclick = () => {
  iframe.src = "";
  modal.style.display = "none";
};

modal.onclick = e => {
  if (e.target === modal) {
    iframe.src = "";
    modal.style.display = "none";
  }
};
</script>

</body>
</html>
